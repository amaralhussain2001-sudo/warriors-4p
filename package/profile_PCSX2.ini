; warriors-4p settings profile (template). Start-Coop.ps1 fills the {PLACEHOLDERS} and writes the result to
; data\PCSX2\inis\PCSX2.ini. Settings that change the game itself (CPU, speed hacks, game fixes, clock, patches) must be
; identical on every PC; the online handshake compares them. Graphics settings may differ per PC.

[UI]
SettingsVersion = 1
SetupWizardIncomplete = false
ConfirmShutdown = false
StartPaused = false
PauseOnFocusLoss = false
StartFullscreen = {FULLSCREEN}
DoubleClickTogglesFullscreen = true
HideMouseCursor = true
RenderToSeparateWindow = false
InhibitScreensaver = true

[AutoUpdater]
CheckAtStartup = false

[Folders]
Bios = {BIOS_DIR}
Snapshots = snaps
Savestates = sstates
MemoryCards = memcards
Logs = logs
Cheats = cheats
Patches = patches
Cache = cache
Textures = textures
InputProfiles = inputprofiles
Videos = videos

[Filenames]
BIOS = {BIOS_FILE}

[EmuCore]
CdvdPrecache = false
EnablePatches = true
EnableCheats = false
EnablePINE = false
EnableWideScreenPatches = false
EnableNoInterlacingPatches = false
EnableFastBoot = true
EnableFastBootFastForward = false
EnableThreadPinning = false
EnableRecordingTools = false
EnableGameFixes = true
SaveStateOnShutdown = false
EnableDiscordPresence = false
InhibitScreensaver = true
ManuallySetRealTimeClock = true
RtcYear = 5
RtcMonth = 10
RtcDay = 1
RtcHour = 12
RtcMinute = 0
RtcSecond = 0
HostFs = false
WarnAboutUnsafeSettings = true

; vuThread (MTVU) must stay off: with it on, the emulated CPU reads a timing value that depends on host thread
; speed, and one of four lockstep instances went out of sync during boot (FINDINGS F-0120).
[EmuCore/Speedhacks]
EECycleRate = {EE_CYCLE_RATE}
EECycleSkip = 0
fastCDVD = false
IntcStat = true
WaitLoop = true
vuFlagHack = true
vuThread = false
vu1Instant = true

[EmuCore/GS]
Renderer = {RENDERER}
Adapter = {ADAPTER}
upscale_multiplier = {UPSCALE}
ExtendedUpscalingMultipliers = true
accurate_blending_unit = 3
filter = 2
MaxAnisotropy = 16
hw_mipmap = true
texture_preloading = 2
dithering_ps2 = 2
linear_present_mode = 1
deinterlace_mode = 0
VsyncEnable = false
AspectRatio = Auto 4:3/3:2
OsdShowFPS = true
OsdShowVPS = false
OsdShowSpeed = false
OsdShowResolution = false
OsdShowCPU = false
OsdShowGPU = false

[Achievements]
Enabled = false

[InputSources]
Keyboard = true
Mouse = false
SDL = true
DInput = false
XInput = false
SDLControllerEnhancedMode = true

[Pad]
MultitapPort1 = false
MultitapPort2 = false

; Your controls: keyboard and the first game controller both work.
[Pad1]
Type = DualShock2
Up = Keyboard/Up
Up = SDL-0/DPadUp
Right = Keyboard/Right
Right = SDL-0/DPadRight
Down = Keyboard/Down
Down = SDL-0/DPadDown
Left = Keyboard/Left
Left = SDL-0/DPadLeft
Triangle = Keyboard/I
Triangle = SDL-0/FaceNorth
Circle = Keyboard/L
Circle = SDL-0/FaceEast
Cross = Keyboard/K
Cross = SDL-0/FaceSouth
Square = Keyboard/J
Square = SDL-0/FaceWest
Select = Keyboard/Backspace
Select = SDL-0/Back
Start = Keyboard/Return
Start = SDL-0/Start
L1 = Keyboard/Q
L1 = SDL-0/LeftShoulder
R1 = Keyboard/E
R1 = SDL-0/RightShoulder
L2 = Keyboard/1
L2 = SDL-0/+LeftTrigger
R2 = Keyboard/3
R2 = SDL-0/+RightTrigger
L3 = Keyboard/2
L3 = SDL-0/LeftStick
R3 = Keyboard/4
R3 = SDL-0/RightStick
LUp = Keyboard/W
LUp = SDL-0/-LeftY
LRight = Keyboard/D
LRight = SDL-0/+LeftX
LDown = Keyboard/S
LDown = SDL-0/+LeftY
LLeft = Keyboard/A
LLeft = SDL-0/-LeftX
RUp = Keyboard/T
RUp = SDL-0/-RightY
RRight = Keyboard/H
RRight = SDL-0/+RightX
RDown = Keyboard/G
RDown = SDL-0/+RightY
RLeft = Keyboard/F
RLeft = SDL-0/-RightX

; Port 2 must exist on every PC (the game reads it); the other player's input reaches it over the network.
[Pad2]
Type = DualShock2

; Only safe hotkeys. Savestates, fast-forward and slow motion are blocked in online sessions anyway.
[Hotkeys]
ToggleFullscreen = Keyboard/Alt & Keyboard/Return
OpenPauseMenu = Keyboard/Escape
Screenshot = Keyboard/F8
W4PToggleAllViews = Keyboard/Tab
W4PToggleAllViews = SDL-0/Touchpad
W4PToggleAllViews = SDL-0/Misc1

[MemoryCards]
Slot1_Enable = true
Slot1_Filename = Mcd001.ps2
Slot2_Enable = true
Slot2_Filename = Mcd002.ps2

[GameList]
RecursivePaths =
